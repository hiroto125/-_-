<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>勤怠打刻 v3</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#17181a;--muted:#737982;--line:#e5e7eb;--dark:#111827;--green:#147a50}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 30px)}
.kicker{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.08em}
h1{font-size:28px;margin:5px 0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 10px 28px rgba(0,0,0,.05)}
.person{display:flex;justify-content:space-between;gap:10px}
.name{font-size:20px;font-weight:800}.sub{font-size:13px;color:var(--muted);margin-top:3px}
.badge{background:#eef0f3;border-radius:999px;padding:7px 10px;height:max-content;font-size:12px;font-weight:800}
.clock{font-size:42px;font-weight:850;letter-spacing:-.04em;margin-top:20px;font-variant-numeric:tabular-nums}
.date{font-size:14px;color:var(--muted);margin-top:5px}
.section{font-size:13px;color:var(--muted);font-weight:800;margin:19px 2px 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:65px;border:0;border-radius:18px;font-size:16px;font-weight:800;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--dark);color:white}.btn.secondary{background:#e8ebef;color:var(--dark)}
.btn.soft{background:white;border:1px solid var(--line);color:var(--dark)}
.log{list-style:none;margin:0;padding:0}.log li{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:13px 0}.log li:last-child{border-bottom:0}
.event{font-weight:800}.meta{font-size:12px;color:var(--muted);margin-top:3px}.time{font-weight:850;font-variant-numeric:tabular-nums}
.empty{font-size:14px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin:12px 3px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:center;justify-content:center;padding:20px;z-index:9999}
.overlay.show{display:flex}
.confirm{width:min(100%,420px);background:#fff;border-radius:26px;padding:24px;box-shadow:0 30px 90px rgba(0,0,0,.28);text-align:center}
.confirm-label{font-size:13px;color:var(--muted);font-weight:800}
.confirm h2{font-size:24px;margin:7px 0 18px}
.confirm-clock{font-size:44px;font-weight:900;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.confirm-date{font-size:13px;color:var(--muted);margin-top:5px}
.confirm-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:23px}
.confirm-buttons button{min-height:54px;border-radius:16px;font-size:16px;font-weight:850}
.no{background:#fff;border:1px solid var(--line);color:var(--dark)}.yes{background:var(--dark);border:1px solid var(--dark);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,18px);background:#111827;color:#fff;border-radius:999px;padding:12px 16px;font-size:13px;font-weight:800;opacity:0;transition:.2s;pointer-events:none;z-index:10000;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.clear{width:100%;margin-top:12px;background:transparent;border:0;color:#a33;font-weight:750;padding:10px}
</style>
</head>
<body>
<main class="app">
  <div class="kicker">MOBILE ATTENDANCE / LOCAL TEST v3</div>
  <h1>勤怠打刻</h1>

  <section class="card">
    <div class="person">
      <div><div class="name">テスト社員</div><div class="sub">社員ID 001 ・ テスト支社</div></div>
      <div class="badge" id="status">未出勤</div>
    </div>
    <div class="clock" id="clock">--:--:--</div>
    <div class="date" id="date">----</div>
  </section>

  <div class="section">打刻</div>
  <div class="grid">
    <button class="btn primary action" data-action="出勤">出勤</button>
    <button class="btn secondary action" data-action="退勤">退勤</button>
    <button class="btn soft action" data-action="休憩開始">休憩開始</button>
    <button class="btn soft action" data-action="休憩終了">休憩終了</button>
    <button class="btn soft action" data-action="外出">外出</button>
    <button class="btn soft action" data-action="帰社">帰社</button>
  </div>

  <div class="section">本日の打刻履歴</div>
  <section class="card">
    <ul class="log" id="log"></ul>
    <div class="empty" id="empty">まだ打刻はありません。</div>
    <button class="clear" id="clear">テスト履歴を消去</button>
  </section>

  <p class="note">この版は動作確認専用です。GPS・サーバー通信は行いません。「はい」を押した瞬間の端末時刻を履歴に記録します。</p>
</main>

<div class="overlay" id="overlay" aria-hidden="true">
  <div class="confirm">
    <div class="confirm-label">打刻確認</div>
    <h2><span id="actionName">出勤</span>を打刻しますか？</h2>
    <div class="confirm-clock" id="confirmClock">--:--:--</div>
    <div class="confirm-date" id="confirmDate">----</div>
    <div class="confirm-buttons">
      <button class="no" id="noBtn" type="button">いいえ</button>
      <button class="yes" id="yesBtn" type="button">はい</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var selectedAction = null;
  var logs = [];
  var overlay = document.getElementById("overlay");
  var actionName = document.getElementById("actionName");
  var clock = document.getElementById("clock");
  var dateEl = document.getElementById("date");
  var confirmClock = document.getElementById("confirmClock");
  var confirmDate = document.getElementById("confirmDate");
  var logEl = document.getElementById("log");
  var empty = document.getElementById("empty");
  var status = document.getElementById("status");
  var toastEl = document.getElementById("toast");

  function pad(n){ return String(n).padStart(2,"0"); }
  function timeString(d){ return pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds()); }
  function dateString(d){
    var days=["日","月","火","水","木","金","土"];
    return d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日（"+days[d.getDay()]+"）";
  }
  function tick(){
    var now=new Date();
    clock.textContent=timeString(now);
    dateEl.textContent=dateString(now);
    if(overlay.classList.contains("show")){
      confirmClock.textContent=timeString(now);
      confirmDate.textContent=dateString(now);
    }
  }
  function showConfirm(action){
    selectedAction=action;
    actionName.textContent=action;
    var now=new Date();
    confirmClock.textContent=timeString(now);
    confirmDate.textContent=dateString(now);
    overlay.classList.add("show");
    overlay.setAttribute("aria-hidden","false");
  }
  function hideConfirm(){
    overlay.classList.remove("show");
    overlay.setAttribute("aria-hidden","true");
    selectedAction=null;
  }
  function toast(msg){
    toastEl.textContent=msg;
    toastEl.classList.add("show");
    clearTimeout(window._toastTimer);
    window._toastTimer=setTimeout(function(){toastEl.classList.remove("show");},1800);
  }
  function currentStatus(){
    if(!logs.length) return "未出勤";
    var a=logs[logs.length-1].action;
    var map={"出勤":"勤務中","休憩開始":"休憩中","休憩終了":"勤務中","外出":"外出中","帰社":"勤務中","退勤":"退勤済み"};
    return map[a] || "未出勤";
  }
  function render(){
    logEl.innerHTML="";
    empty.style.display=logs.length ? "none" : "block";
    status.textContent=currentStatus();
    logs.slice().reverse().forEach(function(item){
      var li=document.createElement("li");
      var left=document.createElement("div");
      var e=document.createElement("div");
      e.className="event"; e.textContent=item.action;
      var m=document.createElement("div");
      m.className="meta"; m.textContent="ローカル動作確認";
      left.appendChild(e); left.appendChild(m);
      var t=document.createElement("div");
      t.className="time"; t.textContent=item.time;
      li.appendChild(left); li.appendChild(t);
      logEl.appendChild(li);
    });
  }

  document.querySelectorAll(".action").forEach(function(btn){
    btn.addEventListener("click",function(){ showConfirm(btn.getAttribute("data-action")); });
  });

  document.getElementById("noBtn").addEventListener("click",hideConfirm);

  document.getElementById("yesBtn").addEventListener("click",function(){
    if(!selectedAction) return;
    var now=new Date(); // 「はい」を押した瞬間
    var action=selectedAction;
    logs.push({action:action,time:timeString(now),date:dateString(now)});
    hideConfirm();
    render();
    toast(action+" "+timeString(now)+" で打刻しました");
  });

  overlay.addEventListener("click",function(e){
    if(e.target===overlay) hideConfirm();
  });

  document.getElementById("clear").addEventListener("click",function(){
    logs=[];
    render();
    toast("履歴を消去しました");
  });

  tick(); setInterval(tick,1000); render();
})();
</script>
</body>
</html>
