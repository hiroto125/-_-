<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>勤怠打刻 v4 GPS</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#17181a;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:520px;margin:auto;padding:30px 16px}.k{font-size:11px;color:#737982;font-weight:800;letter-spacing:.08em}h1{margin:5px 0 14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:18px;margin-bottom:16px}.top{display:flex;justify-content:space-between}.name{font-size:20px;font-weight:800}.muted{font-size:13px;color:#737982}.badge{background:#eef0f3;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:800;height:max-content}.clock{font-size:42px;font-weight:850;margin-top:20px}.section{font-size:13px;color:#737982;font-weight:800;margin:18px 2px 8px}.loc{display:flex;justify-content:space-between;gap:10px}.loc b{font-size:16px}.locbadge{font-size:12px;font-weight:800;background:#fff4e5;color:#8a4b08;border-radius:99px;padding:7px 10px;height:max-content}.locbadge.ok{background:#e8f7ef;color:#11633f}.row{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:14px}.small{border:0;border-radius:14px;padding:12px;font-weight:800}.set{background:#111827;color:#fff}.reset{background:#eef0f3}.radius{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #e5e7eb;margin-top:12px;padding-top:12px;font-size:13px;color:#737982}.radius select{padding:8px;border:1px solid #e5e7eb;border-radius:10px;background:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{min-height:65px;border:0;border-radius:18px;font-size:16px;font-weight:800}.btn:disabled{opacity:.5}.primary{background:#111827;color:#fff}.secondary{background:#e8ebef}.soft{background:#fff;border:1px solid #e5e7eb}.log{list-style:none;padding:0;margin:0}.log li{display:flex;justify-content:space-between;border-bottom:1px solid #e5e7eb;padding:12px 0}.event{font-weight:800}.time{font-weight:800}.note{font-size:12px;color:#737982;line-height:1.6}.overlay{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:20px}.overlay.show{display:flex}.confirm{background:#fff;width:min(100%,420px);border-radius:26px;padding:24px;text-align:center}.ct{font-size:42px;font-weight:900}.gps{display:inline-block;background:#e8f7ef;color:#11633f;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:800}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.choices button{min-height:54px;border-radius:16px;font-weight:800}.yes{background:#111827;color:#fff;border:0}.no{background:#fff;border:1px solid #e5e7eb}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 16px;border-radius:14px;font-size:13px;font-weight:800;display:none;max-width:90%;text-align:center}.toast.show{display:block}</style></head>
<body><main class="app"><div class="k">MOBILE ATTENDANCE / GPS TEST v4</div><h1>勤怠打刻</h1>
<div class="card"><div class="top"><div><div class="name">テスト社員</div><div class="muted">社員ID 001 ・ テスト支社</div></div><div class="badge" id="status">未出勤</div></div><div class="clock" id="clock">--:--:--</div><div class="muted" id="date">----</div></div>
<div class="section">GPSテスト設定</div><div class="card"><div class="loc"><div><b>テスト勤務場所</b><div class="muted" id="locState">現在地を仮の勤務場所として登録してください。</div></div><div class="locbadge" id="locBadge">未設定</div></div><div class="row"><button class="small set" id="setLoc">現在地を勤務場所に設定</button><button class="small reset" id="resetLoc">解除</button></div><div class="radius"><span>打刻できる半径</span><select id="radius"><option>50</option><option>100</option><option selected>150</option><option>200</option><option>300</option></select></div></div>
<div class="section">打刻</div><div class="grid"><button class="btn primary action">出勤</button><button class="btn secondary action">退勤</button><button class="btn soft action">休憩開始</button><button class="btn soft action">休憩終了</button><button class="btn soft action">外出</button><button class="btn soft action">帰社</button></div>
<div class="section">本日の打刻履歴</div><div class="card"><ul class="log" id="log"></ul><div class="muted" id="empty">まだ打刻はありません。</div></div><p class="note">GPSテスト専用版です。位置情報は勤務場所の登録時と打刻時だけ取得します。テスト勤務場所はこのブラウザ内だけに保存します。</p></main>
<div class="overlay" id="overlay"><div class="confirm"><div class="muted">打刻確認</div><h2 id="question"></h2><div class="gps" id="gps"></div><div class="ct" id="cclock"></div><div class="muted" id="cdate"></div><div class="choices"><button class="no" id="no">いいえ</button><button class="yes" id="yes">はい</button></div></div></div><div class="toast" id="toast"></div>
<script>
(()=>{const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,"0"),time=d=>pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds()),date=d=>d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日";let wp=JSON.parse(localStorage.getItem("v4wp")||"null"),pending=null,logs=[];function tick(){let n=new Date();$("clock").textContent=time(n);$("date").textContent=date(n);if($("overlay").classList.contains("show")){$("cclock").textContent=time(n);$("cdate").textContent=date(n)}}tick();setInterval(tick,1000);function toast(s){$("toast").textContent=s;$("toast").classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>$("toast").classList.remove("show"),3500)}function pos(ok){navigator.geolocation.getCurrentPosition(ok,e=>toast(e.code===1?"位置情報を許可してください":"現在地を取得できませんでした"),{enableHighAccuracy:true,timeout:12000,maximumAge:0})}function renderLoc(){if(wp){$("locBadge").textContent="設定済み";$("locBadge").classList.add("ok");$("locState").textContent="打刻時だけ現在地を確認します。"}else{$("locBadge").textContent="未設定";$("locBadge").classList.remove("ok");$("locState").textContent="現在地を仮の勤務場所として登録してください。"}}renderLoc();$("setLoc").onclick=()=>pos(p=>{wp={lat:p.coords.latitude,lon:p.coords.longitude};localStorage.setItem("v4wp",JSON.stringify(wp));renderLoc();toast("テスト勤務場所を設定しました")});$("resetLoc").onclick=()=>{wp=null;localStorage.removeItem("v4wp");renderLoc();toast("勤務場所を解除しました")};function dist(a,b,c,d){let R=6371000,r=x=>x*Math.PI/180,x=r(c-a),y=r(d-b),q=Math.sin(x/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(y/2)**2;return R*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))}document.querySelectorAll(".action").forEach(b=>b.onclick=()=>{if(!wp)return toast("先に勤務場所を設定してください");let action=b.textContent;pos(p=>{let d=dist(wp.lat,wp.lon,p.coords.latitude,p.coords.longitude),rad=+$("radius").value;if(d>rad)return toast("勤務場所の範囲外です（約"+Math.round(d)+"m）");pending={action,d,acc:p.coords.accuracy};$("question").textContent=action+"を打刻しますか？";$("gps").textContent="GPS確認済み・約"+Math.round(d)+"m（精度 ±"+Math.round(p.coords.accuracy)+"m）";$("overlay").classList.add("show")})});$("no").onclick=()=>{$("overlay").classList.remove("show");pending=null};$("yes").onclick=()=>{if(!pending)return;let n=new Date();logs.push({a:pending.action,t:time(n),d:Math.round(pending.d)});$("overlay").classList.remove("show");$("status").textContent=pending.action==="退勤"?"退勤済み":pending.action==="休憩開始"?"休憩中":"勤務中";pending=null;render()};function render(){$("log").innerHTML="";$("empty").style.display=logs.length?"none":"block";[...logs].reverse().forEach(x=>{let li=document.createElement("li");li.innerHTML='<div><div class="event">'+x.a+'</div><div class="muted">GPS確認済み・約'+x.d+'m</div></div><div class="time">'+x.t+'</div>';$("log").appendChild(li)})}})();
</script></body></html>
